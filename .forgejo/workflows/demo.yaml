on:
  workflow_dispatch:
  push:
    branches:
      - main-next

jobs:
  test:
    runs-on: docker

    defaults:
      run:
        shell: bash

    container:
      image: codeberg.org/larchcone/ci/node:20-custom-v1

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - run: id
      - run: pwd
      - run: ls -la
      - run: |
          make ARCH=aarch64 CC=clang-21 LD=ld.lld-21 OBJDUMP=llvm-objdump-21 CXXFILT=llvm-cxxfilt-21 clean kasan_test
          ulimit -t 10 # kill QEMU after 10 seconds CPU time
          make ARCH=aarch64 CC=clang-21 LD=ld.lld-21 OBJDUMP=llvm-objdump-21 CXXFILT=llvm-cxxfilt-21 run
